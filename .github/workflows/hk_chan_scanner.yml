name: HK Stock Chan Theory Daily Scanner

on:
  schedule:
    # 每個星期一至星期五的 UTC 08:20 執行（即香港時間 HKT 16:20）
    - cron: '20 8 * * 1-5'
  
  # 允許在 GitHub 網頁版 Actions 分頁手動點擊「Run workflow」隨時測試
  workflow_dispatch:

jobs:
  run-chan-scanner:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出倉庫程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 3.11 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安裝所需依賴套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行纏論掃描腳本並注入 Telegram Secrets
      - name: Run Chan Theory Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      # 5. （可選）將每日產生的 CSV 結果保存為 GitHub Actions Artifact 供下載
      - name: Upload Scan Result CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hk-chan-signals-${{ github.run_number }}
          path: hk_chan_signals_*.csv
          if-no-files-found: ignore
